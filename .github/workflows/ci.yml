name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catch upstream Proxmox changes that break the patch
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck shushmox install.sh uninstall.sh test/upstream.sh

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/upstream.sh
